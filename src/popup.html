<!DOCTYPE html>
<!--
  Escape the Algorithm - Popup Settings
  This file provides the UI for enabling/disabling content blocking on various social media platforms,
  and includes a theme toggle for light/dark mode.
  Inline comments explain the functionality.
  Licensed under MIT. See LICENSE for details.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Escape the Algorithm Settings</title>
    <!-- Link to external CSS -->
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <!-- Popup header -->
    <h2>ESCAPE THE ALGORITHM</h2>

    <!-- User tip for quick access -->
    <div class="tip">
      <p>📌 Tip: Pin this extension to your toolbar for easy access 🧩</p>
    </div>

    <!-- Toggle for YouTube -->
    <div class="site-toggle">
      <span class="site-name">YouTube</span>
      <label class="toggle-switch">
        <input
          type="checkbox"
          id="youtube-toggle"
          checked
          aria-label="Toggle YouTube"
          role="switch"
          aria-checked="true"
        />
        <span class="slider"></span>
      </label>
    </div>

    <!-- Toggle for Facebook -->
    <div class="site-toggle">
      <span class="site-name">Facebook</span>
      <label class="toggle-switch">
        <input
          type="checkbox"
          id="facebook-toggle"
          checked
          aria-label="Toggle Facebook"
          role="switch"
          aria-checked="true"
        />
        <span class="slider"></span>
      </label>
    </div>

    <!-- Toggle for Instagram -->
    <div class="site-toggle">
      <span class="site-name">Instagram</span>
      <label class="toggle-switch">
        <input
          type="checkbox"
          id="instagram-toggle"
          checked
          aria-label="Toggle Instagram"
          role="switch"
          aria-checked="true"
        />
        <span class="slider"></span>
      </label>
    </div>

    <!-- Toggle for Twitter/X -->
    <div class="site-toggle">
      <span class="site-name">Twitter/X</span>
      <label class="toggle-switch">
        <input
          type="checkbox"
          id="twitter-toggle"
          checked
          aria-label="Toggle Twitter"
          role="switch"
          aria-checked="true"
        />
        <span class="slider"></span>
      </label>
    </div>

    <!-- Toggle for TikTok -->
    <div class="site-toggle">
      <span class="site-name">TikTok</span>
      <label class="toggle-switch">
        <input
          type="checkbox"
          id="tiktok-toggle"
          checked
          aria-label="Toggle TikTok"
          role="switch"
          aria-checked="true"
        />
        <span class="slider"></span>
      </label>
    </div>

    <!-- Toggle for Pinterest -->
    <div class="site-toggle">
      <span class="site-name">Pinterest</span>
      <label class="toggle-switch">
        <input
          type="checkbox"
          id="pinterest-toggle"
          checked
          aria-label="Toggle Pinterest"
          role="switch"
          aria-checked="true"
        />
        <span class="slider"></span>
      </label>
    </div>

    <!-- Toggle for LinkedIn -->
    <div class="site-toggle">
      <span class="site-name">LinkedIn</span>
      <label class="toggle-switch">
        <input
          type="checkbox"
          id="linkedin-toggle"
          checked
          aria-label="Toggle LinkedIn"
          role="switch"
          aria-checked="true"
        />
        <span class="slider"></span>
      </label>
    </div>

    <!-- Toggle for Reddit -->
    <div class="site-toggle">
      <span class="site-name">Reddit</span>
      <label class="toggle-switch">
        <input
          type="checkbox"
          id="reddit-toggle"
          checked
          aria-label="Toggle Reddit"
          role="switch"
          aria-checked="true"
        />
        <span class="slider"></span>
      </label>
    </div>

    <!-- Toggle for Hardcore Mode -->
    <div class="site-toggle">
      <span class="site-name">Hardcore Mode</span>
      <label class="toggle-switch">
        <input
          type="checkbox"
          id="hardcore-toggle"
          aria-label="Toggle Hardcore Mode"
          role="switch"
          aria-checked="false"
        />
        <span class="slider"></span>
      </label>
    </div>

    <!-- Daily limits -->
    <h3 class="section-title">LIMITS</h3>

    <!-- Daily time budget for Twitter/X -->
    <div class="site-toggle">
      <label class="site-name" for="twitter-daily-limit">X Daily Limit</label>
      <select id="twitter-daily-limit" class="limit-select">
        <option value="0">Off</option>
        <option value="5">5 min</option>
        <option value="10">10 min</option>
        <option value="15">15 min</option>
        <option value="20">20 min</option>
        <option value="30">30 min</option>
        <option value="60">60 min</option>
      </select>
    </div>
    <p id="twitter-usage" class="usage-text"></p>

    <!-- How long "Show Hidden Content" lasts before re-hiding -->
    <div class="site-toggle">
      <label class="site-name" for="reveal-minutes">Reveal Lasts</label>
      <select id="reveal-minutes" class="limit-select">
        <option value="1">1 min</option>
        <option value="2">2 min</option>
        <option value="5">5 min</option>
        <option value="10">10 min</option>
      </select>
    </div>

    <!-- Max reveals per day across all sites -->
    <div class="site-toggle">
      <label class="site-name" for="reveals-per-day">Reveals Per Day</label>
      <select id="reveals-per-day" class="limit-select">
        <option value="0">Unlimited</option>
        <option value="1">1</option>
        <option value="3">3</option>
        <option value="5">5</option>
        <option value="10">10</option>
      </select>
    </div>

    <!-- Toggle for Theme (Dark/Light) -->
    <div class="site-toggle">
      <span class="site-name">Dark Theme</span>
      <label class="toggle-switch">
        <input
          type="checkbox"
          id="theme-toggle"
          aria-label="Toggle dark theme"
          role="switch"
          aria-checked="false"
        />
        <span class="slider"></span>
      </label>
    </div>

    <!-- Button to report an issue -->
    <button id="report-button" class="report-button">
      &#x1F9D0; Report an Issue &#x1F527;
    </button>

    <!-- Link to external JavaScript for behavior -->
    <script src="popup.js"></script>
  </body>
</html>
